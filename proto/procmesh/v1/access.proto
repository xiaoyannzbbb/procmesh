syntax = "proto3";

package procmesh.v1;

option go_package = "github.com/qleelulu/procmesh/proto/procmesh/v1;procmeshv1";

import "procmesh/v1/mutation.proto";

message User {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string status = 5; // ACTIVE | DISABLED | LOCKED
  int64 created_unix = 6;
  int64 last_login_unix = 7;
}

message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }

message CreateUserRequest {
  MutationMeta meta = 1;
  string username = 2;
  string password = 3;
  string display_name = 4;
  string email = 5;
}
message CreateUserResponse { User user = 1; }

message DisableUserRequest {
  MutationMeta meta = 1;
  string user_id = 2;
}
message DisableUserResponse { User user = 1; }

message EnableUserRequest {
  MutationMeta meta = 1;
  string user_id = 2;
}
message EnableUserResponse { User user = 1; }

service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc DisableUser(DisableUserRequest) returns (DisableUserResponse);
  rpc EnableUser(EnableUserRequest) returns (EnableUserResponse);
}

message Role {
  string role_id = 1;
  string name = 2;
  repeated string permissions = 3;
}

message Binding {
  string user_id = 1;
  string role_id = 2;
  string scope_type = 3; // CLUSTER | AGENT | AGENT_GROUP | PROCESS_GROUP
  string scope_id = 4;
}

message ListRolesRequest {}
message ListRolesResponse {
  repeated Role roles = 1;
  repeated Binding bindings = 2;
}

message CreateRoleRequest {
  MutationMeta meta = 1;
  string name = 2;
  repeated string permissions = 3;
}
message CreateRoleResponse { Role role = 1; }

message GrantRoleRequest {
  MutationMeta meta = 1;
  string user_id = 2;
  string role_id = 3;
  string scope_type = 4; // CLUSTER | AGENT | AGENT_GROUP | PROCESS_GROUP
  string scope_id = 5;
}
message GrantRoleResponse { Binding binding = 1; }

service RoleService {
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
}

message AgentGroup {
  string group_id = 1;
  string name = 2;
  string description = 3;
  repeated string member_node_ids = 4;
  int64 created_unix = 5;
  int64 updated_unix = 6;
}

message ListAgentGroupsRequest {}
message ListAgentGroupsResponse { repeated AgentGroup groups = 1; }

message CreateAgentGroupRequest {
  MutationMeta meta = 1;
  string name = 2;
  string description = 3;
}
message CreateAgentGroupResponse { AgentGroup group = 1; }

message DeleteAgentGroupRequest {
  MutationMeta meta = 1;
  string group_id = 2;
}
message DeleteAgentGroupResponse {}

message AgentGroupMemberRequest {
  MutationMeta meta = 1;
  string group_id = 2;
  string node_id = 3;
}
message AgentGroupMemberResponse { AgentGroup group = 1; }

service GroupService {
  rpc ListAgentGroups(ListAgentGroupsRequest) returns (ListAgentGroupsResponse);
  rpc CreateAgentGroup(CreateAgentGroupRequest) returns (CreateAgentGroupResponse);
  rpc DeleteAgentGroup(DeleteAgentGroupRequest) returns (DeleteAgentGroupResponse);
  rpc AddAgentGroupMember(AgentGroupMemberRequest) returns (AgentGroupMemberResponse);
  rpc RemoveAgentGroupMember(AgentGroupMemberRequest) returns (AgentGroupMemberResponse);
}

message UpdateRoleRequest {
  MutationMeta meta = 1;
  string role_id = 2;
  string name = 3;
  repeated string permissions = 4;
}
message UpdateRoleResponse { Role role = 1; }

message DeleteRoleRequest {
  MutationMeta meta = 1;
  string role_id = 2;
}
message DeleteRoleResponse {}

message RevokeRoleRequest {
  MutationMeta meta = 1;
  string user_id = 2;
  string role_id = 3;
  string scope_type = 4;
  string scope_id = 5;
}
message RevokeRoleResponse {}
