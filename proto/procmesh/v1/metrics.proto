syntax = "proto3";

package procmesh.v1;

option go_package = "github.com/qleelulu/procmesh/proto/procmesh/v1;procmeshv1";

import "procmesh/v1/cluster_types.proto";

message GetAgentMetricsRequest {}
message AgentMetrics {
  double uptime_seconds = 1;
  int32 process_running = 2;
  int32 members = 3;
  int32 alive = 4;
  bool control_quorum = 5;
  ResourceSummary resources = 6;
}
message GetAgentMetricsResponse { AgentMetrics metrics = 1; }

message GetProcessMetricsRequest {
  string id_or_name = 1;
  string instance_id = 2;
}
message ProcessMetrics {
  string instance_id = 1;
  int32 pid = 2;
  int64 uptime_seconds = 3;
  int32 cpu_percent = 4;   // -1 = unknown
  int64 memory_bytes = 5;  // -1 = unknown
  string note = 6;
}
message GetProcessMetricsResponse { repeated ProcessMetrics metrics = 1; }

message MetricPoint {
  int64 ts_unix = 1;
  double value = 2;
}

message MetricSeries {
  string name = 1;   // cpu_percent | memory_percent | disk_percent | memory_bytes
  string layer = 2;  // raw_min | down_5m
  repeated MetricPoint points = 3; // ASC；缺口省略
}

message GetNodeHistoryRequest {
  string node_id = 1;
  int64 since_unix = 2;
  int64 until_unix = 3;
  string resolution = 4; // empty | raw_min | down_5m
}

message GetNodeHistoryResponse {
  string node_id = 1;
  string layer = 2;
  repeated MetricSeries series = 3;
}

message GetProcessHistoryRequest {
  string id_or_name = 1;
  int64 since_unix = 2;
  int64 until_unix = 3;
  string resolution = 4;
}

message GetProcessHistoryResponse {
  string process_id = 1;
  string layer = 2;
  repeated MetricSeries series = 3;
}

service MetricsService {
  rpc GetAgentMetrics(GetAgentMetricsRequest) returns (GetAgentMetricsResponse);
  rpc GetProcessMetrics(GetProcessMetricsRequest) returns (GetProcessMetricsResponse);
  rpc GetNodeHistory(GetNodeHistoryRequest) returns (GetNodeHistoryResponse);
  rpc GetProcessHistory(GetProcessHistoryRequest) returns (GetProcessHistoryResponse);
}
