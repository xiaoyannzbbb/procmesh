syntax = "proto3";
package procmesh.v1;
option go_package = "github.com/qleelulu/procmesh/proto/procmesh/v1;procmeshv1";

message ErrorInfo {
  string code = 1;    // CONFLICT, NOT_FOUND, INVALID, DEGRADED, ...
  string message = 2;
}

message MutationMeta {
  string operation_id = 1;
  string operator = 2;
}

message Backoff {
  int64 initial_ms = 1;
  int64 max_ms = 2;
  double multiplier = 3;
}

message RestartPolicy {
  string mode = 1;            // never | always | on-failure
  int32 max_retries = 2;
  int64 retry_window_ms = 3;
  Backoff backoff = 4;
}

message HealthCheck {
  string type = 1;            // alive | http | tcp | exec
  string url = 2;
  string method = 3;
  string address = 4;
  string command = 5;
  int32 expected_status = 6;
  repeated string args = 7;
  int64 initial_delay_ms = 8;
  int64 interval_ms = 9;
  int64 timeout_ms = 10;
  int32 failure_threshold = 11;
  int32 success_threshold = 12;
  bool restart_on_failure = 13;
  int64 restart_cooldown_ms = 14;
}

message LogPolicy {
  int64 max_size = 1;
  int32 max_files = 2;
  int64 max_age_seconds = 3;
  bool compress = 4;
  string directory = 5;
  bool redirect_stderr = 6;
}

message ResourceLimit {
  int64 cpu_quota_millis = 1;
  int64 memory_bytes = 2;
  int64 open_files = 3;
}

message Dependency {
  string process_name = 1;
  string condition = 2;       // STARTED | HEALTHY
}

message ProcessSpec {
  string process_id = 1;
  string name = 2;
  string owner_agent_id = 3;
  string group = 4;
  string command = 5;
  repeated string args = 6;
  string working_directory = 7;
  string run_as_user = 8;
  map<string, string> environment = 9;
  int32 instances = 10;
  bool autostart = 11;
  string stop_signal = 12;
  string kill_signal = 13;
  int64 stop_timeout_ms = 14;
  int32 startup_priority = 15;
  RestartPolicy restart = 16;
  HealthCheck health = 17;
  LogPolicy log = 18;
  ResourceLimit resources = 19;
  repeated Dependency dependencies = 20;
  int64 latest_revision = 21;
}

message Instance {
  string instance_id = 1;
  int32 ordinal = 2;
  string desired = 3;
  string observed = 4;
  string health = 5;
  int32 pid = 6;
  int64 active_revision = 7;
  int32 restart_count = 8;
  int32 exit_code = 9;
  bool has_exit_code = 10;
  int64 started_unix_ms = 11;
  bool log_path_pending = 12;
  string last_error = 13;
}

message ProcessView {
  string process_id = 1;
  ProcessSpec spec = 2;
  repeated Instance instances = 3;
}

message ApplyProcessRequest {
  MutationMeta meta = 1;
  int64 expected_revision = 2;
  ProcessSpec spec = 3;
  string comment = 4;
}
message ApplyProcessResponse { ProcessSpec spec = 1; }

message GetProcessRequest { string id_or_name = 1; }
message GetProcessResponse { ProcessView process = 1; }

message ListProcessesRequest {
  string group = 1; // optional process group name filter
}
message ListProcessesResponse { repeated ProcessView processes = 1; }

message DeleteProcessRequest {
  MutationMeta meta = 1;
  string id_or_name = 2;
  int64 expected_revision = 3;
}
message DeleteProcessResponse {}

message ProcessRefRequest {
  MutationMeta meta = 1;
  string id_or_name = 2;
}
message ProcessRefResponse { ProcessView process = 1; }

message AdoptRequest {
  MutationMeta meta = 1;
  string instance_id = 2;
  int32 pid = 3;
}
message AdoptResponse { ProcessView process = 1; }

service ProcessService {
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc GetProcess(GetProcessRequest) returns (GetProcessResponse);
  rpc ApplyProcess(ApplyProcessRequest) returns (ApplyProcessResponse);
  rpc DeleteProcess(DeleteProcessRequest) returns (DeleteProcessResponse);
  rpc StartProcess(ProcessRefRequest) returns (ProcessRefResponse);
  rpc StopProcess(ProcessRefRequest) returns (ProcessRefResponse);
  rpc RestartProcess(ProcessRefRequest) returns (ProcessRefResponse);
  rpc KillProcess(ProcessRefRequest) returns (ProcessRefResponse);
  rpc ResetFailure(ProcessRefRequest) returns (ProcessRefResponse);
  rpc AdoptInstance(AdoptRequest) returns (AdoptResponse);
}

message GetConfigRequest { string id_or_name = 1; }
message GetConfigResponse { ProcessSpec spec = 1; }

message UpdateConfigRequest {
  MutationMeta meta = 1;
  string id_or_name = 2;
  int64 expected_revision = 3;
  ProcessSpec spec = 4;
  string comment = 5;
}
message UpdateConfigResponse { ProcessSpec spec = 1; }

message HistoryRequest { string id_or_name = 1; }
message Revision {
  int64 revision = 1;
  string operator = 2;
  int64 timestamp_unix_ms = 3;
  string diff = 4;
  string comment = 5;
}
message HistoryResponse { repeated Revision revisions = 1; }

message DiffRequest {
  string id_or_name = 1;
  int64 from_revision = 2;
  int64 to_revision = 3;
}
message DiffResponse { string diff = 1; }

message RollbackRequest {
  MutationMeta meta = 1;
  string id_or_name = 2;
  int64 to_revision = 3;
  int64 expected_revision = 4;
  string comment = 5;
}
message RollbackResponse { ProcessSpec spec = 1; }

service ConfigService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc Diff(DiffRequest) returns (DiffResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
}

message TailLogsRequest {
  string id_or_name = 1;
  string instance_id = 2;   // 空 = 全部 instance 的 stdout
  string stream = 3;        // stdout | stderr；默认 stdout
  int32 lines = 4;          // 0 = 默认 100
}
message TailLogsResponse { repeated string lines = 1; }

message StreamLogsRequest {
  string id_or_name = 1;
  string instance_id = 2;
  string stream = 3;
}
message DownloadLogsRequest {
  string id_or_name = 1;
  string instance_id = 2;
  string stream = 3;
}
message LogChunk { bytes data = 1; bool eof = 2; }

service LogService {
  rpc TailLogs(TailLogsRequest) returns (TailLogsResponse);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogChunk);
  rpc DownloadLogs(DownloadLogsRequest) returns (stream LogChunk);
}

message ResourceSummary {
  int32 cpu_percent = 1;
  int32 memory_percent = 2;
  int32 disk_percent = 3;
  bool history_writes_paused = 4;
  int32 history_pause_percent = 5;
}

message ProcessSummary {
  string name = 1;
  string desired = 2;
  string observed = 3;
  string health = 4;
  int64 latest_revision = 5;
  int64 active_revision = 6;
  int64 freshness_unix_ms = 7;
  string process_id = 8;
  string group = 9;
}

message Node {
  string node_id = 1;
  string cluster_id = 2;
  string hostname = 3;
  string boot_id = 4;
  string state = 5; // JOINING | ALIVE | SUSPECT | FAILED | LEFT | REMOVED | REVOKED
  string agent_version = 6;
  int32 protocol_version = 7;
  string api_address = 8;
  string rpc_address = 9;
  string gossip_address = 10;
  map<string, string> labels = 11;
  ResourceSummary resources = 12;
  repeated ProcessSummary processes = 13;
  int64 last_updated_unix_ms = 14;
  repeated string agent_group_ids = 15;
}

message ListNodesRequest {}
message ListNodesResponse { repeated Node nodes = 1; }

message GetNodeRequest { string id_or_hostname = 1; }
message GetNodeResponse { Node node = 1; }

message CreateJoinTokenRequest {
  MutationMeta meta = 1;
  int64 ttl_seconds = 2; // 0 = default
  int32 uses = 3;        // 0 = default
}
message CreateJoinTokenResponse {
  string token_id = 1;
  string token = 2;
  int64 expires_unix = 3;
  int32 uses = 4;
}

message RevokeJoinTokenRequest {
  MutationMeta meta = 1;
  string token_id = 2;
}
message RevokeJoinTokenResponse {}

message RemoveNodeRequest {
  MutationMeta meta = 1;
  string node_id = 2;
}
message RemoveNodeResponse {}

message PromoteNodeRequest {
  MutationMeta meta = 1;
  string node_id = 2;
}
message PromoteNodeResponse {}

service NodeService {
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  rpc RevokeJoinToken(RevokeJoinTokenRequest) returns (RevokeJoinTokenResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  rpc PromoteNode(PromoteNodeRequest) returns (PromoteNodeResponse);
}

message InitClusterRequest {
  MutationMeta meta = 1;
  string admin_username = 2;
}
message InitClusterResponse {
  string cluster_id = 1;
  string node_id = 2;
  string admin_username = 3;
  string admin_password = 4;
}

message JoinClusterRequest {
  MutationMeta meta = 1;
  string token = 2;
  string node_id = 3;
  string hostname = 4;
  string boot_id = 5;
  int32 protocol_version = 6;
  string api_address = 7;
  string gossip_address = 8;
  string rpc_address = 9;
  bytes csr_pem = 10;
  string raft_address = 11;
}
message JoinClusterResponse {
  string cluster_id = 1;
  bytes ca_pem = 2;
  bytes cert_pem = 3;
  string gossip_address = 4;
  string raft_leader = 5;
}

message ClusterOverviewRequest {}
message ClusterOverviewResponse {
  string cluster_id = 1;
  int32 members = 2;
  int32 alive = 3;
  bool control_quorum = 4;
  string control_leader = 5;
  int32 suspect = 6;
  int32 failed = 7;
  int32 process_total = 8;
  int32 process_running = 9;
  int32 process_unhealthy = 10;
  int32 process_fatal = 11;
  int32 cpu_percent = 12;     // ALIVE 成员平均值；无 ALIVE = 0 且 overview_freshness=UNKNOWN
  int32 memory_percent = 13;
  int32 disk_percent = 14;
  bool gossip_healthy = 15;
  bool rpc_healthy = 16;
  bool agent_degraded = 17;
  int64 cert_expires_unix = 18;
  int64 ca_expires_unix = 19;
  int64 view_unix_ms = 20;
  string platform_note = 21;  // 非 linux 必须非空
  map<string, int32> version_counts = 22;
}

message RequestJoinRequest {
  MutationMeta meta = 1;
  string seed_server = 2; // host:port of seed :9000
  string token = 3;
}
message RequestJoinResponse {
  string cluster_id = 1;
  string gossip_address = 2;
}

service ClusterService {
  rpc Init(InitClusterRequest) returns (InitClusterResponse);
  rpc Join(JoinClusterRequest) returns (JoinClusterResponse);
  rpc RequestJoin(RequestJoinRequest) returns (RequestJoinResponse);
  rpc Overview(ClusterOverviewRequest) returns (ClusterOverviewResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}
message LoginResponse {
  string session_id = 1;
  string user_id = 2;
  string username = 3;
  int64 expires_unix = 4;
  string csrf_token = 5;
}

message LogoutRequest { MutationMeta meta = 1; }
message LogoutResponse {}

message CreateAPITokenRequest {
  MutationMeta meta = 1;
  string name = 2;
  int64 ttl_seconds = 3; // 0 = 不过期
}
message CreateAPITokenResponse {
  string token_id = 1;
  string token = 2; // 只返回一次
  int64 expires_unix = 3;
}

message RevokeAPITokenRequest {
  MutationMeta meta = 1;
  string token_id = 2;
}
message RevokeAPITokenResponse {}

message GetMeRequest {}
message GetMeResponse {
  string user_id = 1;
  string username = 2;
  string csrf_token = 3;
  int64 expires_unix = 4;
  repeated string permissions = 5;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc CreateAPIToken(CreateAPITokenRequest) returns (CreateAPITokenResponse);
  rpc RevokeAPIToken(RevokeAPITokenRequest) returns (RevokeAPITokenResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

message User {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string status = 5; // ACTIVE | DISABLED | LOCKED
  int64 created_unix = 6;
  int64 last_login_unix = 7;
}

message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }

message CreateUserRequest {
  MutationMeta meta = 1;
  string username = 2;
  string password = 3;
  string display_name = 4;
  string email = 5;
}
message CreateUserResponse { User user = 1; }

message DisableUserRequest {
  MutationMeta meta = 1;
  string user_id = 2;
}
message DisableUserResponse { User user = 1; }

service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc DisableUser(DisableUserRequest) returns (DisableUserResponse);
}

message Role {
  string role_id = 1;
  string name = 2;
  repeated string permissions = 3;
}

message Binding {
  string user_id = 1;
  string role_id = 2;
  string scope_type = 3; // CLUSTER | AGENT | AGENT_GROUP | PROCESS_GROUP
  string scope_id = 4;
}

message ListRolesRequest {}
message ListRolesResponse {
  repeated Role roles = 1;
  repeated Binding bindings = 2;
}

message CreateRoleRequest {
  MutationMeta meta = 1;
  string name = 2;
  repeated string permissions = 3;
}
message CreateRoleResponse { Role role = 1; }

message GrantRoleRequest {
  MutationMeta meta = 1;
  string user_id = 2;
  string role_id = 3;
  string scope_type = 4; // CLUSTER | AGENT | AGENT_GROUP | PROCESS_GROUP
  string scope_id = 5;
}
message GrantRoleResponse { Binding binding = 1; }

service RoleService {
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
}

message AgentGroup {
  string group_id = 1;
  string name = 2;
  string description = 3;
  repeated string member_node_ids = 4;
  int64 created_unix = 5;
  int64 updated_unix = 6;
}

message ListAgentGroupsRequest {}
message ListAgentGroupsResponse { repeated AgentGroup groups = 1; }

message CreateAgentGroupRequest {
  MutationMeta meta = 1;
  string name = 2;
  string description = 3;
}
message CreateAgentGroupResponse { AgentGroup group = 1; }

message DeleteAgentGroupRequest {
  MutationMeta meta = 1;
  string group_id = 2;
}
message DeleteAgentGroupResponse {}

message AgentGroupMemberRequest {
  MutationMeta meta = 1;
  string group_id = 2;
  string node_id = 3;
}
message AgentGroupMemberResponse { AgentGroup group = 1; }

service GroupService {
  rpc ListAgentGroups(ListAgentGroupsRequest) returns (ListAgentGroupsResponse);
  rpc CreateAgentGroup(CreateAgentGroupRequest) returns (CreateAgentGroupResponse);
  rpc DeleteAgentGroup(DeleteAgentGroupRequest) returns (DeleteAgentGroupResponse);
  rpc AddAgentGroupMember(AgentGroupMemberRequest) returns (AgentGroupMemberResponse);
  rpc RemoveAgentGroupMember(AgentGroupMemberRequest) returns (AgentGroupMemberResponse);
}

message AuditEvent {
  string audit_id = 1;
  int64 timestamp_unix_ms = 2;
  string user_id = 3;
  string username = 4;
  string source_ip = 5;
  string source_agent = 6;
  string target_agent = 7;
  string resource = 8;
  string action = 9;
  string operation_id = 10;
  string result = 11;
  string metadata_json = 12;
}

message AuditEntry {
  AuditEvent event = 1;
  string source_node = 2;
  string freshness = 3; // LIVE | STALE | UNKNOWN
  int64 last_updated_unix_ms = 4;
}

message ListAuditRequest {
  string resource = 1;     // 空 = 全部
  int32 limit = 2;         // 0 = 50；封顶 200
  string target_node = 3;  // 空 = 聚合；非空 = 只查该 node
}
message ListAuditResponse { repeated AuditEntry entries = 1; }

service AuditService {
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);
}

message GetAgentMetricsRequest {}
message AgentMetrics {
  double uptime_seconds = 1;
  int32 process_running = 2;
  int32 members = 3;
  int32 alive = 4;
  bool control_quorum = 5;
  ResourceSummary resources = 6;
}
message GetAgentMetricsResponse { AgentMetrics metrics = 1; }

message GetProcessMetricsRequest {
  string id_or_name = 1;
  string instance_id = 2;
}
message ProcessMetrics {
  string instance_id = 1;
  int32 pid = 2;
  int64 uptime_seconds = 3;
  int32 cpu_percent = 4;   // -1 = unknown
  int64 memory_bytes = 5;  // -1 = unknown
  string note = 6;
}
message GetProcessMetricsResponse { repeated ProcessMetrics metrics = 1; }

message MetricPoint {
  int64 ts_unix = 1;
  double value = 2;
}

message MetricSeries {
  string name = 1;   // cpu_percent | memory_percent | disk_percent | memory_bytes
  string layer = 2;  // raw_min | down_5m
  repeated MetricPoint points = 3; // ASC；缺口省略
}

message GetNodeHistoryRequest {
  string node_id = 1;
  int64 since_unix = 2;
  int64 until_unix = 3;
  string resolution = 4; // empty | raw_min | down_5m
}

message GetNodeHistoryResponse {
  string node_id = 1;
  string layer = 2;
  repeated MetricSeries series = 3;
}

message GetProcessHistoryRequest {
  string id_or_name = 1;
  int64 since_unix = 2;
  int64 until_unix = 3;
  string resolution = 4;
}

message GetProcessHistoryResponse {
  string process_id = 1;
  string layer = 2;
  repeated MetricSeries series = 3;
}

service MetricsService {
  rpc GetAgentMetrics(GetAgentMetricsRequest) returns (GetAgentMetricsResponse);
  rpc GetProcessMetrics(GetProcessMetricsRequest) returns (GetProcessMetricsResponse);
  rpc GetNodeHistory(GetNodeHistoryRequest) returns (GetNodeHistoryResponse);
  rpc GetProcessHistory(GetProcessHistoryRequest) returns (GetProcessHistoryResponse);
}

message ProcessNameRef {
  string node_id = 1;
  string process_name = 2;
}

message BatchSelector {
  repeated string process_ids = 1;
  repeated ProcessNameRef process_names = 2;
  string agent_group_id = 3;
  string process_group = 4;
}

message BatchSummary {
  int32 success = 1;
  int32 failed = 2;
  int32 timeout = 3;
  int32 denied = 4;
  int32 conflict = 5;
  int32 unavailable = 6;
  int32 invalid = 7;
}

message BatchTarget {
  string operation_id = 1;
  string node_id = 2;
  string process_id = 3;
  string process_name = 4;
  string status = 5; // PENDING|RUNNING|SUCCESS|FAILED|TIMEOUT|DENIED|CONFLICT|UNAVAILABLE|INVALID
  string error = 6;
  int64 expected_revision = 7;
  int64 started_unix_ms = 8;
  int64 finished_unix_ms = 9;
}

message Batch {
  string batch_id = 1;
  string operator = 2;
  string source_agent = 3;
  string type = 4; // START|STOP|RESTART|CONFIG_UPDATE
  BatchSelector selector = 5;
  string status = 6; // PENDING|RUNNING|COMPLETED|PARTIAL|FAILED
  BatchSummary summary = 7;
  int64 created_unix_ms = 8;
  repeated BatchTarget targets = 9; // List 可省略；Get 必填
}

message CreateBatchRequest {
  MutationMeta meta = 1;
  string type = 2;
  BatchSelector selector = 3;
  ProcessSpec config = 4; // CONFIG_UPDATE required
  string comment = 5;
}
message CreateBatchResponse { Batch batch = 1; }

message GetBatchRequest { string batch_id = 1; }
message GetBatchResponse { Batch batch = 1; }

message ListBatchesRequest { int32 limit = 1; } // 0 = 50；封顶 200
message ListBatchesResponse { repeated Batch batches = 1; } // 不含 targets，最新在前

message RetryBatchRequest { MutationMeta meta = 1; string batch_id = 2; }
message RetryBatchResponse { Batch batch = 1; }

message ExportBatchRequest {
  string batch_id = 1;
  string format = 2; // json（默认）| csv
}
message ExportBatchResponse {
  bytes content = 1;
  string content_type = 2;
  string filename = 3;
}

service BatchService {
  rpc CreateBatch(CreateBatchRequest) returns (CreateBatchResponse);
  rpc GetBatch(GetBatchRequest) returns (GetBatchResponse);
  rpc ListBatches(ListBatchesRequest) returns (ListBatchesResponse);
  rpc RetryFailed(RetryBatchRequest) returns (RetryBatchResponse);
  rpc ReplayTimeout(RetryBatchRequest) returns (RetryBatchResponse);
  rpc ExportBatch(ExportBatchRequest) returns (ExportBatchResponse);
}

message Alert {
  string alert_id = 1;
  string fingerprint = 2;
  string type = 3;
  string severity = 4;
  string node_id = 5;
  string process_id = 6;
  string payload_json = 7;
  string state = 8; // FIRING | RESOLVED
  int64 first_unix_ms = 9;
  int64 last_unix_ms = 10;
  int64 notified_unix_ms = 11;
  int64 resolved_unix_ms = 12;
  string last_error = 13;
}

message AlertEntry {
  Alert alert = 1;
  string source_node = 2;
  string freshness = 3; // LIVE | STALE | UNKNOWN
  int64 last_updated_unix_ms = 4;
}

message ListAlertsRequest {
  int32 limit = 1;          // 0 = 50；封顶 200
  string target_node = 2;   // 空 = 聚合
  string state = 3;         // 空 = 全部；FIRING | RESOLVED
}
message ListAlertsResponse { repeated AlertEntry entries = 1; }

message GetAlertRequest { string alert_id = 1; }
message GetAlertResponse { AlertEntry entry = 1; }

message AlertChannel {
  string channel_id = 1;
  string type = 2;
  string name = 3;
  bool enabled = 4;
  string config_json = 5; // 已脱敏
  int64 created_unix = 6;
  int64 updated_unix = 7;
}

message ListAlertChannelsRequest {}
message ListAlertChannelsResponse { repeated AlertChannel channels = 1; }

message PutAlertChannelRequest {
  MutationMeta meta = 1;
  string channel_id = 2; // 空 = 创建
  string type = 3;
  string name = 4;
  bool enabled = 5;
  string config_json = 6;
}
message PutAlertChannelResponse { AlertChannel channel = 1; }

message DeleteAlertChannelRequest {
  MutationMeta meta = 1;
  string channel_id = 2;
}
message DeleteAlertChannelResponse {}

message TestAlertChannelRequest {
  MutationMeta meta = 1;
  string channel_id = 2;
}
message TestAlertChannelResponse {}

message AlertPolicy {
  int64 dedup_window_sec = 1;
  bool notify_on_resolve = 2;
  int32 cpu_high_percent = 3;
  int32 memory_high_percent = 4;
  int32 disk_high_percent = 5;
  int32 high_consecutive_mins = 6;
  int64 suspect_too_long_sec = 7;
}

message GetAlertPolicyRequest {}
message GetAlertPolicyResponse { AlertPolicy policy = 1; }

message PutAlertPolicyRequest {
  MutationMeta meta = 1;
  AlertPolicy policy = 2;
}
message PutAlertPolicyResponse { AlertPolicy policy = 1; }

service AlertService {
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  rpc GetAlert(GetAlertRequest) returns (GetAlertResponse);
  rpc ListAlertChannels(ListAlertChannelsRequest) returns (ListAlertChannelsResponse);
  rpc PutAlertChannel(PutAlertChannelRequest) returns (PutAlertChannelResponse);
  rpc DeleteAlertChannel(DeleteAlertChannelRequest) returns (DeleteAlertChannelResponse);
  rpc TestAlertChannel(TestAlertChannelRequest) returns (TestAlertChannelResponse);
  rpc GetAlertPolicy(GetAlertPolicyRequest) returns (GetAlertPolicyResponse);
  rpc PutAlertPolicy(PutAlertPolicyRequest) returns (PutAlertPolicyResponse);
}

message BackupRevisionRange {
  string process_id = 1;
  int64 min_revision = 2;
  int64 max_revision = 3;
}

message BackupSnapshot {
  string snapshot_id = 1;
  string cluster_id = 2;
  string node_id = 3;
  int64 created_unix_ms = 4;
  repeated string process_ids = 5;
  repeated BackupRevisionRange revision_ranges = 6;
  string sha256 = 7;
  string sink = 8;
  string location = 9;
  string source_node_id = 10;
}

message BackupEntry {
  BackupSnapshot snapshot = 1;
  string source_node = 2;
  string freshness = 3; // LIVE | STALE | UNKNOWN
  int64 last_updated_unix_ms = 4;
}

message CreateBackupRequest {
  MutationMeta meta = 1;
  string sink = 2;                    // fs | s3 | peer
  repeated string process_ids = 3;    // 空 = 本机全部
  repeated string target_node_ids = 4; // peer 必填
}
message CreateBackupResponse { BackupSnapshot snapshot = 1; }

message ListBackupsRequest {
  string sink = 1;                    // 空 = 全部本机 index
  repeated string peer_node_ids = 2;  // 按需 hop
  bool include_s3 = 3;
  int32 limit = 4;                    // 0 = 50；封顶 200
}
message ListBackupsResponse { repeated BackupEntry entries = 1; }

message GetBackupRequest {
  string snapshot_id = 1;
  string sink = 2;
  string source_node_id = 3;
  bool include_payload = 4;
}
message GetBackupResponse {
  BackupSnapshot snapshot = 1;
  bytes payload = 2;
}

message DeleteBackupRequest {
  MutationMeta meta = 1;
  string snapshot_id = 2;
  string sink = 3;
  string source_node_id = 4;
}
message DeleteBackupResponse {}

message RestoreTarget {
  string process_id = 1;
  int64 expected_revision = 2;
}
message RestoreBackupRequest {
  MutationMeta meta = 1;
  string snapshot_id = 2;
  string sink = 3;
  string source_node_id = 4;
  repeated RestoreTarget targets = 5;
}
message RestoreProcessResult {
  string process_id = 1;
  string status = 2; // SUCCESS | CONFLICT | INVALID | NOT_FOUND | UNAVAILABLE | DENIED
  int64 new_revision = 3;
  string error = 4;
}
message RestoreBackupResponse { repeated RestoreProcessResult results = 1; }

message PutPeerSnapshotRequest {
  MutationMeta meta = 1;
  string source_node_id = 2;
  bytes payload = 3;
}
message PutPeerSnapshotResponse { BackupSnapshot snapshot = 1; }

service BackupService {
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc GetBackup(GetBackupRequest) returns (GetBackupResponse);
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);
  rpc PutPeerSnapshot(PutPeerSnapshotRequest) returns (PutPeerSnapshotResponse);
}

// ClusterBackupService manages durable backup policy and run metadata. It
// deliberately contains no snapshot payloads or destination credentials.
message ClusterBackupPolicy {
  string policy_id = 1;
  string name = 2;
  bool enabled = 3;
  string schedule_cron = 4;
  string timezone = 5;
  string target_selector = 6;
  repeated string target_node_ids = 7;
  string sink = 8;
  string destination_profile = 9;
  int32 retention_keep_last = 10;
  int32 retention_keep_days = 11;
  int64 retention_max_bytes = 12;
  int32 timeout_seconds = 13;
  int32 max_concurrency = 14;
  string unavailable_policy = 15;
  int64 revision = 16;
}

message ClusterBackupTask {
  string run_id = 1;
  string task_id = 2;
  string node_id = 3;
  string snapshot_id = 4;
  string sha256 = 5;
  string status = 6;
  int64 bytes = 7;
  string error_code = 8;
  string error_summary = 9;
  uint64 leader_term = 10;
  int64 updated_unix = 11;
}

message ClusterBackupRun {
  string run_id = 1;
  string policy_id = 2;
  int64 policy_revision = 3;
  repeated string target_node_ids = 4;
  string status = 5;
  int32 success = 6;
  int32 failed = 7;
  int32 unavailable = 8;
  int32 timeout = 9;
  int64 created_unix = 10;
  int64 started_unix = 11;
  int64 finished_unix = 12;
  repeated ClusterBackupTask tasks = 13;
}

message ClusterBackupDestinationHealth {
  string sink = 1;
  string destination_profile = 2;
  string status = 3;
  string error_summary = 4;
  int64 checked_unix = 5;
  string endpoint_host = 6;
  string node_id = 7;
}

message CreateClusterBackupPolicyRequest {
  MutationMeta meta = 1;
  ClusterBackupPolicy policy = 2;
}
message CreateClusterBackupPolicyResponse { ClusterBackupPolicy policy = 1; }

message UpdateClusterBackupPolicyRequest {
  MutationMeta meta = 1;
  ClusterBackupPolicy policy = 2;
}
message UpdateClusterBackupPolicyResponse { ClusterBackupPolicy policy = 1; }

message DeleteClusterBackupPolicyRequest {
  MutationMeta meta = 1;
  string policy_id = 2;
}
message DeleteClusterBackupPolicyResponse {}

message ListClusterBackupPoliciesRequest {}
message ListClusterBackupPoliciesResponse { repeated ClusterBackupPolicy policies = 1; }

message ValidateClusterBackupPolicyRequest { ClusterBackupPolicy policy = 1; }
message ValidateClusterBackupPolicyResponse {
  bool valid = 1;
  repeated ErrorInfo errors = 2;
}

message StartClusterBackupRunRequest {
  MutationMeta meta = 1;
  string policy_id = 2;
  repeated string target_node_ids = 3;
}
message StartClusterBackupRunResponse { ClusterBackupRun run = 1; }

message GetClusterBackupRunRequest { string run_id = 1; }
message GetClusterBackupRunResponse { ClusterBackupRun run = 1; }

message ListClusterBackupRunsRequest {
  string policy_id = 1;
  int32 limit = 2;
}
message ListClusterBackupRunsResponse { repeated ClusterBackupRun runs = 1; }

message RetryFailedClusterBackupTasksRequest {
  MutationMeta meta = 1;
  string run_id = 2;
}
message RetryFailedClusterBackupTasksResponse { ClusterBackupRun run = 1; }

message GetClusterBackupDestinationHealthRequest {
  string sink = 1;
  string destination_profile = 2;
}
message GetClusterBackupDestinationHealthResponse { ClusterBackupDestinationHealth health = 1; }

message RunClusterBackupTaskRequest {
  string run_id = 1;
  string task_id = 2;
  string node_id = 3;
  int64 policy_revision = 4;
  string sink = 5;
  string destination_profile = 6;
  string policy_id = 7;
  uint64 leader_term = 8;
  int64 lease_expires_unix = 9;
  repeated string process_ids = 10;
}
message RunClusterBackupTaskResponse {
  ClusterBackupTask task = 1;
}

message GetClusterBackupTaskRequest {
  string run_id = 1;
  string task_id = 2;
}
message GetClusterBackupTaskResponse {
  ClusterBackupTask task = 1;
}

service ClusterBackupService {
  rpc CreatePolicy(CreateClusterBackupPolicyRequest) returns (CreateClusterBackupPolicyResponse);
  rpc UpdatePolicy(UpdateClusterBackupPolicyRequest) returns (UpdateClusterBackupPolicyResponse);
  rpc DeletePolicy(DeleteClusterBackupPolicyRequest) returns (DeleteClusterBackupPolicyResponse);
  rpc ListPolicies(ListClusterBackupPoliciesRequest) returns (ListClusterBackupPoliciesResponse);
  rpc ValidatePolicy(ValidateClusterBackupPolicyRequest) returns (ValidateClusterBackupPolicyResponse);
  rpc StartRun(StartClusterBackupRunRequest) returns (StartClusterBackupRunResponse);
  rpc GetRun(GetClusterBackupRunRequest) returns (GetClusterBackupRunResponse);
  rpc ListRuns(ListClusterBackupRunsRequest) returns (ListClusterBackupRunsResponse);
  rpc RetryFailedTasks(RetryFailedClusterBackupTasksRequest) returns (RetryFailedClusterBackupTasksResponse);
  rpc GetDestinationHealth(GetClusterBackupDestinationHealthRequest) returns (GetClusterBackupDestinationHealthResponse);
}

service ClusterBackupAgentService {
  rpc RunTask(RunClusterBackupTaskRequest) returns (RunClusterBackupTaskResponse);
  rpc GetTask(GetClusterBackupTaskRequest) returns (GetClusterBackupTaskResponse);
}

// PeerReplicationService provides internal agent-to-agent snapshot replication.
// Only accessible via Agent mTLS certificates, not Web sessions.
service PeerReplicationService {
  rpc PutSnapshot(PutSnapshotRequest) returns (PutSnapshotResponse);
  rpc ReplicateSnapshot(ReplicateSnapshotRequest) returns (ReplicateSnapshotResponse);
  rpc CheckSnapshot(CheckSnapshotRequest) returns (CheckSnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc GetReplicaMetadata(GetReplicaMetadataRequest) returns (GetReplicaMetadataResponse);
}

message PutSnapshotRequest {
  string cluster_id = 1;
  string snapshot_id = 2;
  string sha256 = 3;
  string run_id = 4;
  string task_id = 5;
  bytes payload = 6;
  string policy_id = 7;
  int64 policy_revision = 8;
}

message PutSnapshotResponse {
  string snapshot_id = 1;
  string cluster_id = 2;
  string sha256 = 3;
  int32 process_count = 4;
  repeated string process_ids = 5;
}

// ReplicateSnapshot is Leader-authorized metadata-only work sent to the
// source Agent. The source reloads the indexed payload and calls PutSnapshot
// itself, so the Leader never observes payload bytes.
message ReplicateSnapshotRequest {
  string run_id = 1;
  string task_id = 2;
  string policy_id = 3;
  int64 policy_revision = 4;
  string source_node_id = 5;
  string target_node_id = 6;
  string snapshot_id = 7;
  string sha256 = 8;
  uint64 leader_term = 9;
  int64 lease_expires_unix = 10;
}

message ReplicateSnapshotResponse {
  string snapshot_id = 1;
  string sha256 = 2;
  int64 bytes = 3;
}

message CheckSnapshotRequest {
  string source_node_id = 1;
  string cluster_id = 2;
  string snapshot_id = 3;
  string sha256 = 4;
}

message CheckSnapshotResponse {
  bool exists = 1;
  bool checksum_matches = 2;
}

message DeleteSnapshotRequest {
  string source_node_id = 1;
  string cluster_id = 2;
  string snapshot_id = 3;
  string intent_id = 4;
  string policy_id = 5;
  int64 policy_revision = 6;
}

message DeleteSnapshotResponse {
  bool deleted = 1;
}

message GetReplicaMetadataRequest {
  string source_node_id = 1;
  string cluster_id = 2;
  string snapshot_id = 3;
}

message GetReplicaMetadataResponse {
  string snapshot_id = 1;
  string cluster_id = 2;
  string node_id = 3;
  string sha256 = 4;
  int64 created_at = 5;
  int32 process_count = 6;
  repeated string process_ids = 7;
}

// DisasterReplicationService provides disaster recovery replication management.
// Accessible via Web UI with proper permissions (replication.read/manage).
service DisasterReplicationService {
  rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);
  rpc GeneratePolicyDraft(GeneratePolicyDraftRequest) returns (GeneratePolicyDraftResponse);
  rpc ApplyPolicyDraft(ApplyPolicyDraftRequest) returns (ApplyPolicyDraftResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc RetryFailedRoutes(RetryFailedRoutesRequest) returns (RetryFailedRoutesResponse);
  rpc VerifyReplica(VerifyReplicaRequest) returns (VerifyReplicaResponse);
  rpc ListRecoverableSnapshots(ListRecoverableSnapshotsRequest) returns (ListRecoverableSnapshotsResponse);
}

message AgentTopologyNode {
  string node_id = 1;
  string host = 2;
  string rack = 3;
  string zone = 4;
  double capacity_weight = 5;
  bool admitted = 6;
  bool alive = 7;
}

message GetTopologyRequest {}

message GetTopologyResponse {
  repeated AgentTopologyNode nodes = 1;
  string cluster_id = 2;
}

message ReplicationRoute {
  string source_node_id = 1;
  repeated string target_node_ids = 2;
  repeated string warnings = 3;
}

message PolicyDraft {
  string name = 1;
  bool enabled = 2;
  string source_selector = 3;
  repeated string source_ids = 4;
  int32 replica_factor = 5;
  repeated ReplicationRoute routes = 6;
  string trigger = 7;
  repeated string primary_policy_ids = 8;
  string schedule_cron = 9;
  string timezone = 10;
  int32 retention_keep_last = 11;
  int32 retention_keep_days = 12;
  int64 retention_max_bytes = 13;
  int32 max_concurrency = 14;
  bool verify_after_copy = 15;
  int64 bandwidth_limit = 16;
  map<string, string> topology_constraints = 17;
  int64 draft_revision = 18;
  string draft_hash = 19;
  repeated string global_warnings = 20;
  map<string, int32> inbound_load = 21;
  string topology_health = 22;
}

message GeneratePolicyDraftRequest {
  string name = 1;
  bool enabled = 2;
  string source_selector = 3;
  repeated string source_ids = 4;
  int32 replica_factor = 5;
  string trigger = 6;
  repeated string primary_policy_ids = 7;
  string schedule_cron = 8;
  string timezone = 9;
  int32 retention_keep_last = 10;
  int32 retention_keep_days = 11;
  int64 retention_max_bytes = 12;
  int32 max_concurrency = 13;
  bool verify_after_copy = 14;
  int64 bandwidth_limit = 15;
  map<string, string> topology_constraints = 16;
}

message GeneratePolicyDraftResponse {
  PolicyDraft draft = 1;
}

message ApplyPolicyDraftRequest {
  string policy_id = 1;
  PolicyDraft draft = 2;
  int64 draft_revision = 3;
  string draft_hash = 4;
  int64 expected_revision = 5;
  MutationMeta meta = 6;
}

message ApplyPolicyDraftResponse {
  string policy_id = 1;
  int64 revision = 2;
}

message ReplicationPolicy {
  string policy_id = 1;
  string name = 2;
  bool enabled = 3;
  string source_selector = 4;
  repeated string source_ids = 5;
  int32 replica_factor = 6;
  repeated ReplicationRoute routes = 7;
  string trigger = 8;
  repeated string primary_policy_ids = 9;
  string schedule_cron = 10;
  string timezone = 11;
  int32 retention_keep_last = 12;
  int32 retention_keep_days = 13;
  int64 retention_max_bytes = 14;
  int32 max_concurrency = 15;
  bool verify_after_copy = 16;
  int64 bandwidth_limit = 17;
  map<string, string> topology_constraints = 18;
  int64 revision = 19;
  int64 created_at = 20;
  int64 updated_at = 21;
}

message ListPoliciesRequest {}

message ListPoliciesResponse {
  repeated ReplicationPolicy policies = 1;
}

message GetPolicyRequest {
  string policy_id = 1;
}

message GetPolicyResponse {
  ReplicationPolicy policy = 1;
}

message UpdatePolicyRequest {
  string policy_id = 1;
  string name = 2;
  bool enabled = 3;
  string source_selector = 4;
  repeated string source_ids = 5;
  int32 replica_factor = 6;
  repeated ReplicationRoute routes = 7;
  string trigger = 8;
  repeated string primary_policy_ids = 9;
  string schedule_cron = 10;
  string timezone = 11;
  int32 retention_keep_last = 12;
  int32 retention_keep_days = 13;
  int64 retention_max_bytes = 14;
  int32 max_concurrency = 15;
  bool verify_after_copy = 16;
  int64 bandwidth_limit = 17;
  map<string, string> topology_constraints = 18;
  int64 expected_revision = 19;
  MutationMeta meta = 20;
}

message UpdatePolicyResponse {
  string policy_id = 1;
  int64 revision = 2;
}

message DeletePolicyRequest {
  string policy_id = 1;
  MutationMeta meta = 2;
}

message DeletePolicyResponse {
  bool deleted = 1;
}

message StartRunRequest {
  string policy_id = 1;
  MutationMeta meta = 2;
  // Exactly one binding source is required for MANUAL runs.
  string primary_run_id = 3;
  repeated ReplicationSnapshotRef snapshot_refs = 4;
}

message ReplicationSnapshotRef {
  string source_node_id = 1;
  string snapshot_id = 2;
  string sha256 = 3;
}

message StartRunResponse {
  string run_id = 1;
  string policy_id = 2;
  int64 policy_revision = 3;
  int64 started_at = 4;
}

message ReplicationTask {
  string task_id = 1;
  string run_id = 2;
  string source_node_id = 3;
  repeated string target_node_ids = 4;
  string status = 5;
  string snapshot_id = 6;
  string sha256 = 7;
  int64 bytes = 8;
  string error_code = 9;
  string error_summary = 10;
  int64 started_at = 11;
  int64 finished_at = 12;
}

message ReplicationRun {
  string run_id = 1;
  string policy_id = 2;
  int64 policy_revision = 3;
  string status = 4;
  repeated ReplicationTask tasks = 5;
  int64 started_at = 6;
  int64 finished_at = 7;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  ReplicationRun run = 1;
}

message ListRunsRequest {
  string policy_id = 1;
}

message ListRunsResponse {
  repeated ReplicationRun runs = 1;
}

message RetryFailedRoutesRequest {
  string run_id = 1;
  MutationMeta meta = 2;
}

message RetryFailedRoutesResponse {
  int32 retried_count = 1;
}

message ReplicaSnapshot {
  string snapshot_id = 1;
  string cluster_id = 2;
  string source_node_id = 3;
  string sha256 = 4;
  int64 created_at = 5;
  int32 process_count = 6;
  repeated string process_ids = 7;
}

message VerifyReplicaRequest {
  string source_node_id = 1;
  string snapshot_id = 2;
}

message VerifyReplicaResponse {
  bool valid = 1;
  string sha256 = 2;
  int32 process_count = 3;
  repeated string process_ids = 4;
  repeated string errors = 5;
}

message ListRecoverableSnapshotsRequest {}

message ListRecoverableSnapshotsResponse {
  repeated ReplicaSnapshot snapshots = 1;
}
