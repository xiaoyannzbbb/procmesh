syntax = "proto3";

package procmesh.v1;

option go_package = "github.com/qleelulu/procmesh/proto/procmesh/v1;procmeshv1";


// PeerReplicationService provides internal agent-to-agent snapshot replication.
// Only accessible via Agent mTLS certificates, not Web sessions.
service PeerReplicationService {
  rpc PutSnapshot(PutSnapshotRequest) returns (PutSnapshotResponse);
  rpc ReplicateSnapshot(ReplicateSnapshotRequest) returns (ReplicateSnapshotResponse);
  rpc CheckSnapshot(CheckSnapshotRequest) returns (CheckSnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc GetReplicaMetadata(GetReplicaMetadataRequest) returns (GetReplicaMetadataResponse);
  rpc FetchSnapshot(FetchSnapshotRequest) returns (FetchSnapshotResponse);
}

message PutSnapshotRequest {
  string cluster_id = 1;
  string snapshot_id = 2;
  string sha256 = 3;
  string run_id = 4;
  string task_id = 5;
  bytes payload = 6;
  string policy_id = 7;
  int64 policy_revision = 8;
}

message PutSnapshotResponse {
  string snapshot_id = 1;
  string cluster_id = 2;
  string sha256 = 3;
  int32 process_count = 4;
  repeated string process_ids = 5;
}

// ReplicateSnapshot is Leader-authorized metadata-only work sent to the
// source Agent. The source reloads the indexed payload and calls PutSnapshot
// itself, so the Leader never observes payload bytes.
message ReplicateSnapshotRequest {
  string run_id = 1;
  string task_id = 2;
  string policy_id = 3;
  int64 policy_revision = 4;
  string source_node_id = 5;
  string target_node_id = 6;
  string snapshot_id = 7;
  string sha256 = 8;
  uint64 leader_term = 9;
  int64 lease_expires_unix = 10;
}

message ReplicateSnapshotResponse {
  string snapshot_id = 1;
  string sha256 = 2;
  int64 bytes = 3;
}

message CheckSnapshotRequest {
  string source_node_id = 1;
  string cluster_id = 2;
  string snapshot_id = 3;
  string sha256 = 4;
}

message CheckSnapshotResponse {
  bool exists = 1;
  bool checksum_matches = 2;
}

message DeleteSnapshotRequest {
  string source_node_id = 1;
  string cluster_id = 2;
  string snapshot_id = 3;
  string intent_id = 4;
  string policy_id = 5;
  int64 policy_revision = 6;
}

message DeleteSnapshotResponse {
  bool deleted = 1;
}

message GetReplicaMetadataRequest {
  string source_node_id = 1;
  string cluster_id = 2;
  string snapshot_id = 3;
}

message GetReplicaMetadataResponse {
  string snapshot_id = 1;
  string cluster_id = 2;
  string node_id = 3;
  string sha256 = 4;
  int64 created_at = 5;
  int32 process_count = 6;
  repeated string process_ids = 7;
}

// FetchSnapshot is an internal mTLS-only pull used by the source Owner during
// disaster recovery. The requester certificate must identify source_node_id.
message FetchSnapshotRequest {
  string source_node_id = 1;
  string cluster_id = 2;
  string snapshot_id = 3;
  string sha256 = 4;
}

message FetchSnapshotResponse {
  string source_node_id = 1;
  string cluster_id = 2;
  string snapshot_id = 3;
  string sha256 = 4;
  repeated string process_ids = 5;
  bytes payload = 6;
}
