# Procmesh Agent 完整配置示例。
#
# Linux 默认路径：/etc/procmesh/agent.yaml
# macOS 默认路径：~/.config/procmesh/agent.yaml
# 对应命令行参数的显式设置优先于本文件，例如 --data-dir、--listen、--pprof-listen、--gossip、--rpc、--control。

# Agent 数据根目录。未传 --data-dir 时必填；Linux 生产环境通常使用 /var/lib/procmesh。
data_dir: "/var/lib/procmesh"

# HTTP API 本地绑定地址。未传 --listen 时使用此值；留空时默认 127.0.0.1:18680。
listen: "127.0.0.1:18680"

# Go pprof 诊断服务。留空表示关闭；建议只绑定回环地址并通过 SSH 隧道采样。
pprof:
  listen: ""

# 本机紧急检查通道。只提供 process list/get/logs，不依赖集群 Session，也不监听 TCP。
break_glass:
  # Unix socket 路径。留空时使用 $data_dir/break-glass.sock；生产环境也可放在 /run。
  socket: "/run/procmesh-break-glass.sock"
  # 留空时 socket 为 0600，仅 Agent OS 用户（生产通常为 root）可访问。
  # 配置后 socket 为 0660，并允许该 OS 组；socket 父目录必须允许该组穿越。
  group: ""

# 磁盘保护策略。三个百分比必须满足：warn_percent < cleanup_percent < emergency_percent。
disk:
  # 磁盘使用率严格超过此值时记录告警。默认：85。
  warn_percent: 85
  # auto_delete 为 true 时，使用率严格超过此值会删除最旧的进程日志。默认：90。
  cleanup_percent: 90
  # emergency_stop_writes 为 true 时，使用率严格超过此值会停止新的日志和历史指标写入。默认：95。
  emergency_percent: 95
  # 是否在达到 cleanup_percent 后自动删除最旧的进程日志。默认：false。
  auto_delete: false
  # 是否在达到 emergency_percent 后停止新的日志和历史指标写入。默认：true。
  emergency_stop_writes: true

# Memberlist Gossip 集群通信地址。
gossip:
  # 本地绑定地址。留空时默认 127.0.0.1:18689。
  listen: "127.0.0.1:18689"
  # 向其他节点公布的地址。留空时使用实际绑定地址；仅填 IP/主机名时沿用 listen 端口。
  advertise: ""
  # memberlist LZW 压缩会降低 Gossip 带宽，但显著增加小包的 CPU 和临时内存分配。默认：false。
  compression: false

# Agent 间 mTLS RPC 通信地址。
rpc:
  # 本地绑定地址。留空时默认 127.0.0.1:18683。
  listen: "127.0.0.1:18683"
  # 向其他节点公布的地址。留空时使用实际绑定地址；仅填 IP/主机名时沿用 listen 端口。
  advertise: ""

# Raft 控制面通信地址。
control:
  # 本地绑定地址。留空时默认 127.0.0.1:18685。
  listen: "127.0.0.1:18685"
  # 向其他节点公布的地址。留空时使用实际绑定地址；仅填 IP/主机名时沿用 listen 端口。
  advertise: ""

# 远程进程规格写入。默认全部允许；true 后仅本机回环 CLI（Bearer）可做对应操作。
# Web、跨节点转发、非回环 CLI 都会被拒绝。改完需重启 Agent。
process:
  # 禁止远程添加进程（新建 / YAML 创建）。默认：false。
  disable_remote_create: false
  # 禁止远程修改进程规格（编辑 / 回滚 / scale）。默认：false。
  disable_remote_update: false
  # 禁止远程删除进程。默认：false。
  disable_remote_delete: false

# 在线 Agent 更新。改完需重启 Agent。
update:
  # GitHub owner/repo，用于解析 latest stable。默认与 scripts/install.sh 相同。
  repository: "xiaoyannzbbb/procmesh"
  # false 时本节点拒绝被在线升级。默认：true。
  enabled: true

# 批量操作执行策略。
batch:
  # 同时执行的目标数，允许范围 1-64。默认：16。
  max_concurrency: 16
  # 单个目标的超时，使用 Go duration 格式，例如 500ms、30s、2m。默认：30s。
  target_timeout: "30s"

# 本地和 S3 配置备份。
backup:
  # 文件系统备份目录。留空时使用 $data_dir/backup/fs。
  fs_dir: ""
  # 本地定时备份的五字段 cron（分 时 日 月 周）。留空表示关闭，例如 "0 * * * *"。
  schedule: ""

  # 传统默认 S3 备份目标，供本地 BackupService 的 sink=s3 使用。
  s3:
    # S3 兼容服务端点；bucket 非空时必须设置。生产环境应使用 HTTPS。
    endpoint: ""
    # S3 存储桶名称。留空时不启用默认 S3 目标。
    bucket: ""
    # 对象键前缀；可留空。
    prefix: ""
    # AWS 区域；留空时 S3 客户端使用 us-east-1。
    region: ""
    # 访问密钥。建议留空并用 PROCMESH_S3_ACCESS_KEY 环境变量提供，环境变量优先。
    access_key: ""
    # 密钥。建议留空并用 PROCMESH_S3_SECRET_KEY 环境变量提供，环境变量优先。
    secret_key: ""
    # 仅供本地测试允许 HTTP 端点；生产环境保持 false。
    insecure: false

  # 集群备份策略引用的命名 S3 目标。键名（例如 archive）即 destination_profile。
  # 可继续添加更多配置项，每项均需包含以下全部字段。
  s3_profiles:
    archive:
      # S3 兼容服务端点；生产环境应使用 HTTPS。
      endpoint: "https://s3.example.com"
      # S3 存储桶名称。
      bucket: "procmesh-backups"
      # 对象键前缀；可留空。
      prefix: "procmesh"
      # AWS 区域；留空时 S3 客户端使用 us-east-1。
      region: "us-east-1"
      # 此命名配置项的访问密钥。请替换为真实密钥，且不要提交含密钥的配置文件。
      access_key: ""
      # 此命名配置项的密钥。请替换为真实密钥，且不要提交含密钥的配置文件。
      secret_key: ""
      # 仅供本地测试允许 HTTP 端点；生产环境保持 false。
      insecure: false
