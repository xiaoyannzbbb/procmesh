name: demo-worker
command: /bin/sh
args:
  - -c
  - while true; do date; sleep 5; done
working_directory: /tmp/test
instances: 1
autostart: true

restart:
  mode: always
  max_retries: 10
  retry_window_ms: 60000
  backoff:
    initial_ms: 1000
    max_ms: 30000
    multiplier: 2

health:
  type: alive
  initial_delay_ms: 1000
  interval_ms: 5000
  timeout_ms: 1000
  failure_threshold: 3
  success_threshold: 1

log:
  max_size: 10485760
  max_files: 5
  max_age_seconds: 604800
  compress: true